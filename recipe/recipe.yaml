schema_version: 1

context:
  version: "0.3.9"

package:
  name: iqplot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/iqplot/iqplot-${{ version }}.tar.gz
  sha256: 7f27c4e29b47d592d8e833c921a2507fddf3e05805516e7b3963947c45f24161

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python =${{ python_min }}
    - setuptools
  run:
    - bokeh
    - colorcet
    - numpy
    - pandas
    - python
    - xarray
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - iqplot
  - requirements:
      run:
        - pip
        - python =${{ python_min }}
    script:
      - pip check

about:
  summary: Generate Bokeh plots for data sets with one quantitative variable.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/justinbois/iqplot

extra:
  recipe-maintainers:
    - danielnachun
