schema_version: 1

context:
  version: "0.3.8"

package:
  name: iqplot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/iqplot/iqplot-${{ version }}.tar.gz
  sha256: 7fbf5ddc3f74a92e29c8b36d3b499416ece2d7dc272e895371cc11d696483b7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python =${{ python_min }}
    - setuptools
  run:
    - bokeh
    - colorcet
    - numpy
    - pandas
    - python
    - xarray
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - iqplot
  - requirements:
      run:
        - pip
        - python =${{ python_min }}
    script:
      - pip check

about:
  summary: Generate Bokeh plots for data sets with one quantitative variable.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/justinbois/iqplot

extra:
  recipe-maintainers:
    - danielnachun
